<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>NOVASPORTS LIVE</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/NovaplayGO/novaimg/main/NovaSports.png">
    <!-- Hls.js optimizado para streaming IPTV en directo -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e50914;
            --primary-hover: #b91c1c;
            --bg: #000000;
        }

        * { box-sizing: border-box; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; font-family: 'Inter', sans-serif; }

        #player-container { width: 100vw; height: 100vh; position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }

        /* Pantalla Evento Finalizado */
        #event-ended { position: absolute; inset: 0; z-index: 5000; display: none; align-items: center; justify-content: center; flex-direction: column; background: var(--bg); text-align: center; padding: 30px; }
        #event-ended img { width: 120px; margin-bottom: 30px; filter: drop-shadow(0 0 20px rgba(229, 9, 20, 0.4)); }
        #event-ended h1 { color: #fff; font-size: clamp(24px, 5vw, 42px); font-weight: 900; margin: 0 0 15px; }
        #event-ended p { color: #888; font-size: 18px; max-width: 600px; line-height: 1.5; margin: 0; }

        /* Terminal de Estado en Letras Verdes (Arriba Izquierda) */
        #status-terminal {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 4000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 0, 0.4);
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.7);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            transition: opacity 0.5s ease;
            display: none;
        }

        /* Botón Superior para Activar Sonido */
        #audio-btn {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4500;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.5);
            display: none;
            transition: 0.2s;
            align-items: center;
            gap: 8px;
        }
        #audio-btn:hover { transform: translateX(-50%) scale(1.05); background: var(--primary-hover); }

        /* UI Overlays */
        .watermark { position: absolute; top: 30px; right: 30px; width: 100px; opacity: 0.5; pointer-events: none; z-index: 1000; }

        #fullscreen-btn { position: absolute; bottom: 30px; right: 30px; z-index: 2000; width: 50px; height: 50px; border: none; border-radius: 50%; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); color: white; font-size: 20px; cursor: pointer; opacity: 0; transition: 0.3s; display: flex; align-items: center; justify-content: center; }
        #player-container:hover #fullscreen-btn, #player-container:hover .watermark { opacity: 1; }
        #fullscreen-btn:hover { background: var(--primary); transform: scale(1.1); }

        /* Custom Loading */
        #loader { position: absolute; width: 50px; height: 50px; border: 4px solid #333; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; z-index: 10; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="player-container">
    <div id="loader"></div>
    <div id="status-terminal">Iniciando...</div>
    <button id="audio-btn"><i class="fas fa-volume-up"></i> 🔊 ACTIVAR SONIDO</button>

    <!-- Con controles nativos predeterminados -->
    <video id="video" autoplay playsinline controls disablepictureinpicture controlslist="nodownload noremoteplayback"></video>

    <img src="https://raw.githubusercontent.com/NovaplayGO/novaimg/main/NovaSports.png" class="watermark" alt="NovaPlay">

    <button id="fullscreen-btn" title="Pantalla completa">⛶</button>

    <!-- EVENTO FINALIZADO -->
    <div id="event-ended">
        <img src="https://raw.githubusercontent.com/NovaplayGO/novaimg/main/NovaSports.png" alt="NovaPlay">
        <h1>EVENTO FINALIZADO</h1>
        <p>La transmisión se reactivará automáticamente cuando inicie el próximo evento programado.</p>
    </div>
</div>

<script>
(function() {
    // Protección estricta contra copia, inspección y modo desarrollador
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83 || e.keyCode === 65))) {
            e.preventDefault();
            return false;
        }
    });
    document.onselectstart = () => false;
    document.oncopy = () => false;

    const video = document.getElementById('video');
    const loader = document.getElementById('loader');
    const eventEnded = document.getElementById('event-ended');
    const fsBtn = document.getElementById('fullscreen-btn');
    const statusTerminal = document.getElementById('status-terminal');
    const audioBtn = document.getElementById('audio-btn');

    let isConnectedOnce = false;

    function updateStatus(msg, show = true) {
        if (isConnectedOnce || !statusTerminal) return;
        statusTerminal.textContent = msg;
        statusTerminal.style.display = show ? 'block' : 'none';
        statusTerminal.style.opacity = show ? '1' : '0';
    }

    let hls = null;
    let currentUrl = "";
    const CONNECTOR_URL = "https://mrghnngupolsgatcmevw.supabase.co/functions/v1/access_connector";
    const APP_USER = "novaplay";

    async function fetchSafeData(action) {
        try {
            updateStatus("Conectando con Servidor...");
            const authRes = await fetch(CONNECTOR_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: "obtener_credenciales", usuario: APP_USER })
            });
            const credentials = await authRes.json();
            const authHeader = "Basic " + btoa(`${APP_USER}:${credentials.password}`);

            updateStatus("NovaPlay autorizó la Conexión.");
            const dataRes = await fetch(CONNECTOR_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': authHeader },
                body: JSON.stringify({ action: action })
            });
            return await dataRes.json();
        } catch (e) {
            updateStatus("Error de conexión con el servidor.");
            return null;
        }
    }

    async function getSignal() {
        try {
            updateStatus("Conectando con Servidor...");
            const data = await fetchSafeData("obtener_json");
            if (!data) return "";
            for (const cat of data) {
                const ch = (cat.items || []).find(i => i.name === "TIGO SPORTS #3");
                if (ch) {
                    updateStatus("Transmisión Eventos Permitido.");
                    return ch.url || "";
                }
            }
        } catch (e) {}
        return "";
    }

    async function playSignal(url) {
        if (currentUrl === url && hls) return;
        loader.style.display = 'block';
        currentUrl = url;
        eventEnded.style.display = 'none';

        if (Hls.isSupported()) {
            if (hls) hls.destroy();
            hls = new Hls({
                enableWorker: true,
                lowLatencyMode: false,
                backBufferLength: 30,
                maxBufferLength: 30,
                maxMaxBufferLength: 60,
                maxBufferSize: 30 * 1000 * 1000,
                liveSyncDurationCount: 3,
                fragLoadingMaxRetry: 8,
                manifestLoadingMaxRetry: 8
            });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.muted = false;
                video.play().then(() => {
                    audioBtn.style.display = 'none';
                }).catch(() => {
                    // Si el navegador bloquea el audio sin interacción, activar mute y mostrar botón superior
                    video.muted = true;
                    video.play().catch(() => {});
                    audioBtn.style.display = 'flex';
                });
                loader.style.display = 'none';
                updateStatus("Conectado.");
                isConnectedOnce = true;
                if (statusTerminal) statusTerminal.style.display = 'none';
            });
            hls.on(Hls.Events.ERROR, (e, d) => {
                if (d.fatal) {
                    switch (d.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            if (!isConnectedOnce) updateStatus("Reconectando por error de red...");
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            if (!isConnectedOnce) updateStatus("Recuperando medio...");
                            hls.recoverMediaError();
                            break;
                        default:
                            hls.destroy();
                            eventEnded.style.display = 'flex';
                            loader.style.display = 'none';
                            updateStatus("Transmisión finalizada.", false);
                            break;
                    }
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.muted = false;
            video.play().then(() => {
                audioBtn.style.display = 'none';
            }).catch(() => {
                video.muted = true;
                video.play().catch(() => {});
                audioBtn.style.display = 'flex';
            });
            loader.style.display = 'none';
            updateStatus("Conectado.");
            isConnectedOnce = true;
            if (statusTerminal) statusTerminal.style.display = 'none';
        }
    }

    async function monitor() {
        updateStatus("Iniciando...");
        const url = await getSignal();
        if (!url) {
            eventEnded.style.display = 'flex';
            loader.style.display = 'none';
            updateStatus("Señal no disponible.", false);
        } else {
            await playSignal(url);
        }
    }

    // Botón Superior para Activar Sonido
    audioBtn.onclick = (e) => {
        e.stopPropagation();
        video.muted = false;
        video.play().then(() => {
            audioBtn.style.display = 'none';
        }).catch(() => {});
    };

    // Botón de Pantalla Completa (Derecha) - Toggle bidireccional
    fsBtn.onclick = (e) => {
        e.stopPropagation();
        video.muted = false;
        video.play().catch(() => {});
        const elem = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
    };

    function handleInteraction() {
        if (video.muted) {
            video.muted = false;
            video.play().catch(() => {});
        }
    }

    document.addEventListener('click', handleInteraction);
    document.addEventListener('touchstart', handleInteraction);

    // Watchdog anti-congelamiento optimizado
    setInterval(() => {
        if (video.paused && !video.ended && currentUrl) {
            video.play().catch(() => {});
        }
    }, 2000);

    setInterval(monitor, 30000);
    monitor();
})();
</script>
</body>
</html>
