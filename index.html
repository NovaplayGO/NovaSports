<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>NOVASPORTS LIVE</title>
    <link rel="icon" type="image/webp" href="https://raw.githubusercontent.com/novaplaygo/novaimg/main/novasplash.webp">
    <!-- Shaka Player CDN (Google) - El reproductor más robusto contra recargas y buffering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e50914;
            --bg: #000000;
            --overlay: rgba(0, 0, 0, 0.7);
        }

        * { box-sizing: border-box; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; font-family: 'Inter', sans-serif; }

        #player-container { width: 100vw; height: 100vh; position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; pointer-events: auto; }

        /* Pantalla Evento Finalizado */
        #event-ended { position: absolute; inset: 0; z-index: 5000; display: none; align-items: center; justify-content: center; flex-direction: column; background: var(--bg); text-align: center; padding: 30px; }
        #event-ended img { width: 120px; margin-bottom: 30px; filter: drop-shadow(0 0 20px rgba(229, 9, 20, 0.4)); }
        #event-ended h1 { color: #fff; font-size: clamp(24px, 5vw, 42px); font-weight: 900; margin: 0 0 15px; letter-spacing: -1px; }
        #event-ended p { color: #888; font-size: 18px; max-width: 600px; line-height: 1.5; margin: 0; }
        #event-status { margin-top: 30px; color: var(--primary); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 2px; }

        /* UI Overlays */
        .watermark { position: absolute; top: 30px; right: 30px; width: 100px; opacity: 0.5; pointer-events: none; z-index: 1000; transition: 0.3s; }

        #fullscreen-btn { position: absolute; bottom: 30px; right: 30px; z-index: 2000; width: 50px; height: 50px; border: none; border-radius: 50%; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); color: white; font-size: 24px; cursor: pointer; opacity: 0; transition: 0.3s; display: flex; align-items: center; justify-content: center; }
        #player-container:hover #fullscreen-btn, #player-container:hover .watermark { opacity: 1; }
        #fullscreen-btn:hover { background: var(--primary); transform: scale(1.1); }

        /* Custom Loading */
        #loader { position: absolute; width: 50px; height: 50px; border: 4px solid #333; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; z-index: 10; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="player-container">
    <div id="loader"></div>

    <video id="video" autoplay playsinline controls disablepictureinpicture controlslist="nodownload noremoteplayback"></video>

    <img src="https://raw.githubusercontent.com/novaplaygo/novaimg/main/novasplash.webp" class="watermark" alt="NovaPlay">

    <button id="fullscreen-btn" title="Pantalla completa">⛶</button>

    <!-- EVENTO FINALIZADO -->
    <div id="event-ended">
        <img src="https://raw.githubusercontent.com/novaplaygo/novaimg/main/novasplash.webp" alt="NovaPlay">
        <h1>EVENTO FINALIZADO</h1>
        <p>La transmisión se reactivará automáticamente cuando inicie el próximo evento programado.</p>
        <div id="event-status">Sincronizando señal...</div>
    </div>
</div>

<script>
(function() {
    // Protección estricta contra copia, inspección y modo desarrollador
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if (
            e.keyCode === 123 || // F12
            (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || // Ctrl+Shift+I/J/C
            (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83 || e.keyCode === 65)) // Ctrl+U/S/A
        ) {
            e.preventDefault();
            return false;
        }
    });
    document.onselectstart = () => false;
    document.oncopy = () => false;

    const video = document.getElementById('video');
    const loader = document.getElementById('loader');
    const eventEnded = document.getElementById('event-ended');
    const eventStatus = document.getElementById('event-status');
    const fsBtn = document.getElementById('fullscreen-btn');

    let player = null;
    let currentUrl = "";
    let endedUrl = "";
    const CONNECTOR_URL = "https://mrghnngupolsgatcmevw.supabase.co/functions/v1/access_connector";
    const APP_USER = "novaplay";

    async function fetchSafeData(action) {
        try {
            const authRes = await fetch(CONNECTOR_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: "obtener_credenciales", usuario: APP_USER })
            });
            const credentials = await authRes.json();
            const authHeader = "Basic " + btoa(`${APP_USER}:${credentials.password}`);

            const dataRes = await fetch(CONNECTOR_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': authHeader
                },
                body: JSON.stringify({ action: action })
            });
            return await dataRes.json();
        } catch (e) {
            console.error("Error en conexión segura:", e);
            return null;
        }
    }

    async function getSignal() {
        try {
            const data = await fetchSafeData("obtener_json");
            if (!data) return "";
            for (const cat of data) {
                const ch = (cat.items || []).find(i => i.name === "TIGO SPORTS #1");
                if (ch) return ch.url || "";
            }
        } catch (e) { console.error("Error datos: " + e.message); }
        return "";
    }

    async function playSignal(url) {
        if (endedUrl === url || (currentUrl === url && player)) return;

        loader.style.display = 'block';
        currentUrl = url;
        eventEnded.style.display = 'none';

        try {
            if (!window.shakaInitialized) {
                shaka.polyfill.installAll();
                if (!shaka.Player.isBrowserSupported()) {
                    console.error("Navegador no soporta Shaka Player");
                    loader.style.display = 'none';
                    return;
                }
                window.shakaInitialized = true;
            }

            if (!player) {
                player = new shaka.Player(video);
                // Configuración de búfer masivo (60s-120s) y tolerancia a errores de red
                player.configure({
                    streaming: {
                        bufferingGoal: 60,
                        rebufferingGoal: 15,
                        bufferBehind: 30,
                        stallEnabled: true,
                        stallThreshold: 1,
                        retryParameters: {
                            maxAttempts: 15,
                            baseDelay: 1000,
                            backoffFactor: 2,
                            timeout: 30000
                        }
                    }
                });

                player.addEventListener('error', (event) => {
                    console.error("Error en Shaka Player:", event.detail);
                    if (event.detail.severity === shaka.util.Error.Severity.CRITICAL) {
                        endedUrl = url;
                        eventEnded.style.display = 'flex';
                        loader.style.display = 'none';
                    }
                });
            }

            await player.load(url);
            video.muted = false;
            video.play().catch(() => {});
            loader.style.display = 'none';
        } catch (e) {
            console.error("Error cargando señal con Shaka:", e);
            loader.style.display = 'none';
            endedUrl = url;
            eventEnded.style.display = 'flex';
        }
    }

    async function monitor() {
        const url = await getSignal();
        if (!url) {
            eventEnded.style.display = 'flex';
            loader.style.display = 'none';
        } else {
            await playSignal(url);
        }
    }

    // Activar sonido y pantalla completa obligatoria al interactuar
    function handleInteraction() {
        video.muted = false;
        video.play().catch(() => {});
        const elem = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        }
    }

    document.addEventListener('click', handleInteraction);
    document.addEventListener('touchstart', handleInteraction);

    fsBtn.onclick = handleInteraction;

    // Watchdog de congelamiento / pausa automática
    setInterval(() => {
        if (video.paused && !video.ended && currentUrl) {
            video.muted = false;
            video.play().catch(() => {});
        }
    }, 3000);

    setInterval(monitor, 30000);
    monitor();
})();
</script>
</body>
</html>
